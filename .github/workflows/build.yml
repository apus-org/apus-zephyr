name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: apus-zephyr
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Set up Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1.0.15
        with:
          app-path: apus-zephyr
          toolchains: arm-zephyr-eabi

      - name: Build samples
        working-directory: apus-zephyr
        run: |
          west twister -p apus -v --inline-logs \
            -T ../zephyr/samples/hello_world \
            -T ../zephyr/samples/basic/blinky \
            -T ../zephyr/samples/basic/button \
            -T ../zephyr/samples/basic/rgb_led \
            -T ../zephyr/samples/drivers/led/pwm \
            -T ../zephyr/samples/sensor/thermometer \
            -T ../zephyr/samples/sensor/die_temp_polling \
            -T ../zephyr/samples/drivers/buzzer/tone \
            -T ../zephyr/samples/drivers/can/counter \
            -T ../zephyr/samples/subsys/input/input_dump
